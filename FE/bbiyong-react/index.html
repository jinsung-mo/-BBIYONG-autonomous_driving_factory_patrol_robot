  <!-- v3 디자인의 타이포는 Gothic A1(본문)과 IBM Plex Mono(숫자)를 전제한다.
       지정만 해 두면 그 글꼴이 깔린 기기에서만 맞고 나머지는 조용히 fallback 이 된다 —
       화면마다 다르게 보이는 것을 막으려면 받아 와야 한다.
       공장이 망 밖이면 링크는 실패하고 fallback 으로 그려질 뿐, 화면이 깨지지는 않는다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" />
</head>
