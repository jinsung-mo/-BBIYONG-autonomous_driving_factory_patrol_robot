# =========================================================
# BBIYONG - Git Tag 자동 버저닝 파이프라인 (scripts/auto_tagger.py)
# =========================================================
# [사전 설정 필수]
#  1) 활성화된 GitLab Runner  (없으면 파이프라인이 pending 상태로 멈춥니다)
#  2) CI/CD Variables 에 TAG_PUSH_TOKEN 등록
#     - Project Access Token 또는 PAT, scope = write_repository (태그 push 용)
#     - Settings > CI/CD > Variables, [Masked] 체크 권장
#  3) 매일 minor 태깅을 원하면 Pipeline schedules 등록
#     - Settings > CI/CD > Pipeline schedules > New schedule
#     - Interval 예: `0 18 * * *` (매일), Target branch: be_system/dev(원하는 통합 브랜치)
#
# [트리거별 동작]
#  - main 브랜치 push/병합   -> major
#  - 스케줄(schedule) 실행    -> minor
#  - */dev 브랜치 push       -> patch
#  - 그 외(feature/MR/tag)   -> 실행 안 함
#  * auto_tagger.py 가 "새 커밋 없으면 skip" 을 처리하므로 빈 태그는 생기지 않습니다.

stages:
  - tag

auto-tag:
  stage: tag
  image: python:3.12-slim
  variables:
    GIT_DEPTH: "0"            # 전체 히스토리/태그 확보 (shallow clone 방지)
  rules:
    - if: '$CI_COMMIT_TAG'    # 태그 push 로 인한 재실행(무한 루프) 방지
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        BUMP: "major"
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      variables:
        BUMP: "minor"
    - if: '$CI_COMMIT_BRANCH =~ /\/dev$/'
      variables:
        BUMP: "patch"
    - when: never
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - git config user.email "ci@bbiyong.local"
    - git config user.name "BBIYONG CI Auto Tagger"
    # write_repository 권한 토큰으로 push 가능한 origin 재설정
    - git remote set-url origin "https://oauth2:${TAG_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script:
    - python scripts/auto_tagger.py --type "$BUMP"
