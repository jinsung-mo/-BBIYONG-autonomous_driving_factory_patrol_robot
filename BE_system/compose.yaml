services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bbiyong-server
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /opt/bbiyong/data:/app/data
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/bbiyong
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
    depends_on:
      - mysql
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: bbiyong-mysql
    environment:
      MYSQL_DATABASE: bbiyong
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - /opt/bbiyong/mysql_data:/var/lib/mysql
    restart: unless-stopped
