plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bbiyong'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.hibernate.orm:hibernate-community-dialects'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'org.xerial:sqlite-jdbc:3.53.1.0'

	// 인증/인가(MVP): Spring Security 필터 체인 + BCrypt 해시 + JWT 발급/검증
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// API 문서 자동화 (SpringDoc OpenAPI 3.0)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

	// 구조화된 로깅 (Logback JSON Encoder)
	implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

	// OpenCV(bytedeco) — 2D 도면 정제(S15P11E101-518). 네이티브는 배포(linux)·개발(windows)
	// 플랫폼만 번들해 용량 최소화. (opencv-platform 전체 대신 classifier 지정)
	implementation 'org.bytedeco:opencv:4.9.0-1.5.10'
	implementation 'org.bytedeco:javacpp:1.5.10'
	implementation 'org.bytedeco:openblas:0.3.26-1.5.10'
	runtimeOnly 'org.bytedeco:opencv:4.9.0-1.5.10:linux-x86_64'
	runtimeOnly 'org.bytedeco:opencv:4.9.0-1.5.10:windows-x86_64'
	runtimeOnly 'org.bytedeco:javacpp:1.5.10:linux-x86_64'
	runtimeOnly 'org.bytedeco:javacpp:1.5.10:windows-x86_64'
	runtimeOnly 'org.bytedeco:openblas:0.3.26-1.5.10:linux-x86_64'
	runtimeOnly 'org.bytedeco:openblas:0.3.26-1.5.10:windows-x86_64'
}

tasks.named('test') {
	useJUnitPlatform()

	// Jenkins CI 환경 변수를 시스템 프로퍼티로 전달
	systemProperty 'spring.datasource.url', System.getenv('TEST_DATASOURCE_URL') ?: 'jdbc:mysql://127.0.0.1:3307/bbiyong_test'
	systemProperty 'spring.datasource.username', System.getenv('TEST_DATASOURCE_USERNAME') ?: 'test'
	systemProperty 'spring.datasource.password', System.getenv('TEST_DATASOURCE_PASSWORD') ?: 'test'
}
