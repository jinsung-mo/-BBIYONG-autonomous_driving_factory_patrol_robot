services:
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bbiyong_test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
      MYSQL_ROOT_PASSWORD: test-root-password
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ptest-root-password"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
