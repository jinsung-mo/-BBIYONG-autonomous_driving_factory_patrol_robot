spring.application.name=bbiyong-server

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:bbiyong.db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 커넥션 풀: SQLite(로컬/테스트)는 단일 writer라 1, MySQL 배포에선 DB_POOL_SIZE 로 확장(예: 10).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:1}

# JWT - 환경변수(BBIYONG_JWT_SECRET) 필수 주입. HS256 이므로 32바이트 이상.
# 공개 저장소에 기본값을 두면 토큰 위조(인증 전면 우회)가 가능하므로 기본값 없이 미설정 시 기동 실패. (S15P11E101-715)
bbiyong.jwt.secret=${BBIYONG_JWT_SECRET:}
# access: 짧게(1h), refresh: 길게(30d). 야간 무인 관제는 refresh 토큰(/api/auth/refresh)으로 무중단 갱신.
bbiyong.jwt.access-expiration-seconds=${BBIYONG_JWT_ACCESS_EXPIRATION_SECONDS:3600}
bbiyong.jwt.refresh-expiration-seconds=${BBIYONG_JWT_REFRESH_EXPIRATION_SECONDS:2592000}

# 최초 관리자 부트스트랩(선택). 설정 시 기동 때 해당 계정을 ROLE_ADMIN 으로 create-or-promote.
# 회원가입 기본 권한은 ROLE_USER 이므로, 신규 배포 환경의 첫 관리자는 이 값으로 지정한다.
bbiyong.admin.email=${BBIYONG_ADMIN_EMAIL:}
bbiyong.admin.password=${BBIYONG_ADMIN_PASSWORD:}
bbiyong.admin.name=${BBIYONG_ADMIN_NAME:관제 관리자}

bbiyong.mattermost.allowed-hosts=${BBIYONG_MATTERMOST_ALLOWED_HOSTS:meeting.ssafy.com}

# 로봇 연결/해제를 SYSTEM 이벤트(이벤트 탭 '시스템' 필터)로 남길지. 기본 on.
bbiyong.event.log-robot-connection=${BBIYONG_EVENT_LOG_ROBOT_CONNECTION:true}

# 자동 순찰 스케줄러 (S15P11E101-850 콘솔 정리로 자동 순찰 스케줄 기능 제거).
# 기본 OFF — DB 에 저장된 활성 스케줄이 있어도 cron 등록을 하지 않아 자동 순찰이 발동되지 않는다.
# 기능을 되살리려면 true 로 주입한다.
bbiyong.patrol.scheduler.enabled=${BBIYONG_PATROL_SCHEDULER_ENABLED:false}

# 이메일 인증코드 발송(SMTP). 기본값은 Gmail SMTP.
#  - BBIYONG_MAIL_USERNAME: 발신 Gmail 주소, BBIYONG_MAIL_PASSWORD: Gmail 앱 비밀번호(2FA 필요).
#  - username 미설정 시 개발모드로 동작: 실제 발송 대신 인증코드를 서버 로그(INFO)에 출력한다.
spring.mail.host=${BBIYONG_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${BBIYONG_MAIL_PORT:587}
spring.mail.username=${BBIYONG_MAIL_USERNAME:}
spring.mail.password=${BBIYONG_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# 인증코드 정책. 코드 유효 5분, 검증 성공 후 '인증됨' 상태 유지 30분(그 안에 회원가입/재설정 완료).
# bbiyong.mail.from=${BBIYONG_MAIL_FROM:삐용 관제 <no-reply@bbiyong.io>}
bbiyong.mail.code-ttl-seconds=${BBIYONG_MAIL_CODE_TTL_SECONDS:300}
bbiyong.mail.verified-ttl-seconds=${BBIYONG_MAIL_VERIFIED_TTL_SECONDS:1800}
bbiyong.mail.max-verify-attempts=${BBIYONG_MAIL_MAX_VERIFY_ATTEMPTS:5}

# 로봇/게이트웨이 공유 토큰(X-Robot-Token). JWT 없는 로봇 인증에 사용:
#  - REST 업로드: /api/maps/upload · /api/videos/upload (RobotUploadTokenFilter, S15P11E101-517)
#  - WebSocket 핸드셰이크: /ws/robot (RobotHandshakeAuthInterceptor, S15P11E101-596) — 헤더 또는 ?token=
# BBIYONG_ROBOT_UPLOAD_TOKEN 환경변수 필수 주입. 공개 기본값/비활성 폴백은 사칭·가짜 경보 주입을
# 허용하므로 제거 - 미설정 시 기동 실패(fail-fast). (S15P11E101-715)
bbiyong.robot.upload-token=${BBIYONG_ROBOT_UPLOAD_TOKEN:}

# 영상 아카이브 파일 저장(MVP: 로컬 파일시스템). 운영 시 BBIYONG_VIDEO_STORAGE_DIR 로 볼륨 경로 주입.
bbiyong.video.storage-dir=${BBIYONG_VIDEO_STORAGE_DIR:video-store}
spring.servlet.multipart.max-file-size=${BBIYONG_VIDEO_MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${BBIYONG_VIDEO_MAX_REQUEST_SIZE:210MB}

# 2D 맵 이미지 저장(MVP: 로컬 파일시스템). 운영 시 BBIYONG_MAP_STORAGE_DIR 로 볼륨 경로 주입.
bbiyong.map.storage-dir=${BBIYONG_MAP_STORAGE_DIR:map-store}

# 2D 도면(FLOORPLAN) 후처리 파라미터. 실 로봇 PGM 으로 검증한 기본값. (S15P11E101-640)
# scale=업스케일 배율, poly-epsilon=벽 직선화 강도(px), ortho-tolerance-deg=직각 스냅 허용각,
# wall-band=벽 두께(px), obstacle-inset=장애물 판정 내부 침식(벽 요철 배제), deskew=수평 보정.
bbiyong.floorplan.scale=${BBIYONG_FLOORPLAN_SCALE:10}
bbiyong.floorplan.poly-epsilon=${BBIYONG_FLOORPLAN_POLY_EPSILON:10.0}
bbiyong.floorplan.ortho-tolerance-deg=${BBIYONG_FLOORPLAN_ORTHO_TOL:25.0}
bbiyong.floorplan.wall-band=${BBIYONG_FLOORPLAN_WALL_BAND:14}
bbiyong.floorplan.obstacle-inset=${BBIYONG_FLOORPLAN_OBSTACLE_INSET:12}
bbiyong.floorplan.obstacle-min-area=${BBIYONG_FLOORPLAN_OBSTACLE_MIN_AREA:250}
bbiyong.floorplan.deskew=${BBIYONG_FLOORPLAN_DESKEW:true}

# 전면 카메라 상하 각도(CAMERA_TILT) 가동 범위(절대각 degrees). FE 는 동일 범위로 버튼 잠금/현재각을 표시한다.
bbiyong.camera.tilt-min=${BBIYONG_CAMERA_TILT_MIN:-30.0}
bbiyong.camera.tilt-max=${BBIYONG_CAMERA_TILT_MAX:45.0}

# Actuator 엔드포인트 노출 (health, info, metrics 등)
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.health.defaults.enabled=true

# Jenkins CD 는 서버가 트래픽을 처리할 준비가 됐는지만 확인한다.
# 로봇 연결 상태는 전체 /actuator/health 의 운영 진단에 유지하되 배포 성공 조건에서는 제외한다.
management.endpoint.health.group.deployment.include=db,diskSpace
management.endpoint.health.group.deployment.show-details=never
management.endpoint.health.group.deployment.show-components=never

# SpringDoc OpenAPI 설정
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.show-actuator=true
