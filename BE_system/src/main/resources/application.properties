spring.application.name=bbiyong-server

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:bbiyong.db}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 커넥션 풀: SQLite(로컬/테스트)는 단일 writer라 1, MySQL 배포에선 DB_POOL_SIZE 로 확장(예: 10).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:1}

# JWT (MVP) - 운영 시 환경변수(BBIYONG_JWT_SECRET)로 주입 권장. HS256 이므로 32바이트 이상.
bbiyong.jwt.secret=${BBIYONG_JWT_SECRET:bbiyong-dev-secret-key-please-change-in-production-0123456789}
bbiyong.jwt.expiration-seconds=86400
