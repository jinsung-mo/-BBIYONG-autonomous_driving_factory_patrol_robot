spring.application.name=bbiyong-server

spring.datasource.url=jdbc:sqlite:bbiyong.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=1

# JWT (MVP) - 운영 시 환경변수(BBIYONG_JWT_SECRET)로 주입 권장. HS256 이므로 32바이트 이상.
bbiyong.jwt.secret=${BBIYONG_JWT_SECRET:bbiyong-dev-secret-key-please-change-in-production-0123456789}
bbiyong.jwt.expiration-seconds=86400
