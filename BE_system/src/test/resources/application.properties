spring.application.name=bbiyong-server-test

spring.datasource.url=jdbc:sqlite:test-bbiyong.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=1

bbiyong.tcp.port=0

# JWT (test) - HS256 이므로 32바이트 이상
bbiyong.jwt.secret=bbiyong-test-secret-key-0123456789-abcdefghijklmnop
bbiyong.jwt.expiration-seconds=86400
