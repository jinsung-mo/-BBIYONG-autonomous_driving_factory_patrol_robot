spring.application.name=bbiyong-server-test

spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/bbiyong_test}
spring.datasource.username=${TEST_DATASOURCE_USERNAME:test}
spring.datasource.password=${TEST_DATASOURCE_PASSWORD:test}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=3

bbiyong.tcp.port=0

# JWT (test) - HS256 이므로 32바이트 이상
bbiyong.jwt.secret=bbiyong-test-secret-key-0123456789-abcdefghijklmnop

# 로봇 공유 토큰 (test) - 운영은 BBIYONG_ROBOT_UPLOAD_TOKEN 필수(fail-fast). (S15P11E101-715)
bbiyong.robot.upload-token=test-robot-secret
bbiyong.jwt.access-expiration-seconds=3600
bbiyong.jwt.refresh-expiration-seconds=2592000

# 로봇 연결/해제 SYSTEM 이벤트 로깅(test) — WSS 연결 테스트가 SYSTEM 이벤트를 만들지 않도록 끈다.
bbiyong.event.log-robot-connection=false
