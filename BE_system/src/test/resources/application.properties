spring.application.name=bbiyong-server-test

spring.datasource.url=${TEST_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3307/bbiyong_test}
spring.datasource.username=${TEST_DATASOURCE_USERNAME:test}
spring.datasource.password=${TEST_DATASOURCE_PASSWORD:test}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.datasource.hikari.maximum-pool-size=3

bbiyong.tcp.port=0

# JWT (test) - HS256 이므로 32바이트 이상
bbiyong.jwt.secret=bbiyong-test-secret-key-0123456789-abcdefghijklmnop

# 로봇 공유 토큰 (test) - 운영은 BBIYONG_ROBOT_UPLOAD_TOKEN 필수(fail-fast). (S15P11E101-715)
bbiyong.robot.upload-token=test-robot-secret
bbiyong.jwt.access-expiration-seconds=3600
bbiyong.jwt.refresh-expiration-seconds=2592000

# 🔴 SMTP (test) — 이 파일이 메인 application.properties 를 '보완'하는 게 아니라
# **통째로 가린다**(같은 파일명이라 클래스패스에서 테스트 리소스가 이긴다). 그래서 메인에만
# 있는 spring.mail.host 가 테스트에는 없었고, MailSenderAutoConfiguration 이 JavaMailSender
# 빈을 만들지 않아 그것을 주입받는 EmailVerificationService(S15P11E101-846) 생성이 실패,
# **전체 ApplicationContext 로딩이 깨졌다**(테스트 210건 중 49건 실패).
# AuthControllerTests 만 통과했던 이유는 그 클래스가 해당 서비스를 @MockitoBean 으로
# 대체하기 때문이다 — 자기 테스트만 통과하고 나머지 클래스를 전부 무너뜨렸다.
# username 은 비워 둔다 → 서비스가 개발모드로 떠서 실제 발송을 시도하지 않는다.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=
spring.mail.password=
