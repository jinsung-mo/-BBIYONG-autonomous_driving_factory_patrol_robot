ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ydlidar
    frame_id: laser_frame
    ignore_array: ""
    baudrate: 128000
    lidar_type: 1
    device_type: 0
    sample_rate: 5
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: false
    # ROS LaserScan angles are counter-clockwise. The 2026-07-27 rotation bag
    # measured a +89.79 degree scan shift during a +90.31 degree left odometry
    # turn, proving the clockwise driver output was mirrored. Keep this true
    # for the backward mount: physical mounting direction belongs in the
    # base_link -> laser_frame yaw transform.
    inverted: true
    auto_reconnect: true
    isSingleChannel: true
    intensity: false
    intensity_bit: 0
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 10.0
    range_min: 0.12
    frequency: 8.0
    invalid_range_is_inf: true
    debug: false
