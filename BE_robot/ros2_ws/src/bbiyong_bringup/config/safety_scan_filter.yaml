# Mapping keeps /scan_filtered unchanged. Collision safety uses a separate
# chain: the hard-stop sees body-filtered points, while slowdown additionally
# requires a spatially consistent cluster.
safety_body_filter:
  ros__parameters:
    filter1:
      name: robot_body
      type: laser_filters/LaserScanBoxFilter
      params:
        box_frame: base_link
        # Strictly inside the hard-stop polygon. External obstacles remain
        # visible in a 9-14 cm band around this self-exclusion box.
        min_x: -0.25
        max_x: 0.24
        min_y: -0.20
        max_y: 0.20
        min_z: -0.20
        max_z: 0.20
        invert: false

safety_speckle_filter:
  ros__parameters:
    filter1:
      name: consistent_cluster
      type: laser_filters/LaserScanSpeckleFilter
      params:
        filter_type: 1
        max_range: 1.0
        max_range_difference: 0.10
        filter_window: 3
