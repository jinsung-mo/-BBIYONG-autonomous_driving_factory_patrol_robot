collision_monitor:
  ros__parameters:
    use_sim_time: false
    enabled: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel/autonomy_raw
    cmd_vel_out_topic: /cmd_vel/autonomy
    state_topic: /collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0

    polygons: [immediate_stop, directional_approach]
    immediate_stop:
      type: circle
      radius: 0.20
      action_type: stop
      # A non-self point inside the compact emergency zone always stops the
      # robot, regardless of commanded direction.
      max_points: 0
      visualize: true
      polygon_pub_topic: /collision_monitor/immediate_stop
      enabled: true
    directional_approach:
      type: circle
      radius: 0.30
      action_type: approach
      # Humble's approach model projects the circular footprint along the
      # current linear/angular command. A nearby point outside the commanded
      # sweep no longer blocks motion, while forward, reverse, and in-place
      # rotation collisions remain protected.
      # Project only half a second ahead. The independent 0.30 m immediate
      # stop remains active for the physical footprint.
      time_before_collision: 0.5
      simulation_time_step: 0.05
      max_points: 0
      visualize: true
      polygon_pub_topic: /collision_monitor/directional_approach
      enabled: false
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan_safety_body
      enabled: true
